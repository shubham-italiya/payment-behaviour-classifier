[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-behaviour-classifier"
version = "1.0.0"
description = "Predict which customers will pay late from six months of statement and payment history."
readme = "README.md"
license = "MIT"
authors = [{ name = "Shubham S. Italiya" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "matplotlib>=3.8",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
